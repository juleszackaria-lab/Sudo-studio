name: 02 - Build Runtime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Verify folders
      - name: Debug folders
        run: dir

      - name: Debug backend folder
        run: dir backend

      - name: Debug runtime folder
        run: dir backend\runtime

      # Install dependencies
      - name: Install Python dependencies
        working-directory: backend/runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Build EXE
      - name: Build runtime executable
        working-directory: backend/runtime
        run: |
          pyinstaller --onefile --name server server.py

      # Verify build
      - name: Verify build
        run: dir backend\runtime\dist

      # Upload artifact
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-exe
          path: backend/runtime/dist/server.exe