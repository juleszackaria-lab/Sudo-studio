name: 99 - Paren path experiment (TEMP)

# TEMPORARY diagnostic: proves start.bat survives install paths with
# parentheses (e.g. C:\Program Files (x86)\SudoStudio). Runs the shipped
# start.bat from a paren dir AND from a clean control dir with stub exes,
# under a watchdog (start.bat never exits by itself: monitor loop).
# DELETE THIS FILE after green proof. Never gates anything.

on:
  workflow_dispatch:

jobs:
  paren-path-repro:
    name: Paren path repro
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup paren + control dirs with stubs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($d in @('C:\ptest (x86)\SudoStudio', 'C:\ptest-clean\SudoStudio')) {
            New-Item -ItemType Directory -Force -Path "$d\backend" | Out-Null
            New-Item -ItemType Directory -Force -Path "$d\runtime" | Out-Null
            Copy-Item 'start.bat' "$d\start.bat"
            Copy-Item 'C:\Windows\System32\timeout.exe' "$d\backend\backend.exe"
            Copy-Item 'C:\Windows\System32\timeout.exe' "$d\runtime\runtime.exe"
            Copy-Item 'C:\Windows\System32\timeout.exe' "$d\SudoStudio.exe"
          }
          Get-ChildItem 'C:\ptest (x86)\SudoStudio' -Recurse | Select-Object FullName

      - name: Run start.bat in paren dir (watchdog 150s)
        shell: pwsh
        run: |
          $d = 'C:\ptest (x86)\SudoStudio'
          $p = Start-Process cmd.exe -ArgumentList '/c', 'start.bat > run-paren.log 2>&1' -WorkingDirectory $d -PassThru
          Start-Sleep -Seconds 150
          & taskkill /PID $p.Id /T /F 2>$null
          Write-Host '--- run-paren.log ---'
          Get-Content "$d\run-paren.log" -Raw
          $l = Join-Path $env:LOCALAPPDATA 'SudoStudio\logs\startup.log'
          if (Test-Path $l) { Copy-Item $l '.\startup-paren.log'; Write-Host 'startup-paren.log SAVED' } else { Write-Host 'NO startup.log after paren run' }

      - name: Run start.bat in control dir (watchdog 150s)
        shell: pwsh
        run: |
          $d = 'C:\ptest-clean\SudoStudio'
          $p = Start-Process cmd.exe -ArgumentList '/c', 'start.bat > run-clean.log 2>&1' -WorkingDirectory $d -PassThru
          Start-Sleep -Seconds 150
          & taskkill /PID $p.Id /T /F 2>$null
          Write-Host '--- run-clean.log ---'
          Get-Content "$d\run-clean.log" -Raw
          $l = Join-Path $env:LOCALAPPDATA 'SudoStudio\logs\startup.log'
          if (Test-Path $l) { Copy-Item $l '.\startup-clean.log'; Write-Host 'startup-clean.log SAVED' } else { Write-Host 'NO startup.log after control run' }

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          Copy-Item 'C:\ptest (x86)\SudoStudio\run-paren.log' '.\run-paren.log' -ErrorAction SilentlyContinue
          Copy-Item 'C:\ptest-clean\SudoStudio\run-clean.log' '.\run-clean.log' -ErrorAction SilentlyContinue
          Get-ChildItem .\*.log | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paren-exp-logs
          if-no-files-found: warn
          path: |
            run-paren.log
            run-clean.log
            startup-paren.log
            startup-clean.log
