name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      # sql.js is 100% pure JavaScript (SQLite compiled to WebAssembly/asm.js).
      # Zero native .node files — no dlopen(), no bindings.js crash under pkg.
      # bcryptjs is also pure-JS. No native modules at all.
      - name: Build backend.exe
        run: pkg package.json --targets node18-win-x64 --output backend.exe

      # sql.js uses a .wasm file. pkg embeds it in the snapshot but we also
      # copy it next to the exe so the locateFile() callback can find it on disk
      # (fallback if pkg snapshot wasm loading fails on some Windows builds).
      - name: Copy sql-wasm.wasm next to backend.exe
        shell: powershell
        run: |
          $wasmSrc = "node_modules\sql.js\dist\sql-wasm.wasm"
          if (Test-Path $wasmSrc) {
            Copy-Item $wasmSrc -Destination "sql-wasm.wasm"
            Write-Host "[OK] Copied sql-wasm.wasm next to backend.exe"
          } else {
            Write-Warning "[WARN] sql-wasm.wasm not found at $wasmSrc"
          }

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe built: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found!"
            exit 1
          }
          if (Test-Path "sql-wasm.wasm") {
            Write-Host "[OK] sql-wasm.wasm present"
          } else {
            Write-Warning "[WARN] sql-wasm.wasm missing — asm.js fallback will be used"
          }

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            backend/backend.exe
            backend/sql-wasm.wasm
