name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      # FIX: Use pkg package.json config (includes assets for better_sqlite3.node)
      # better-sqlite3 has ONE .node binary (no bindings indirection via Error.stack)
      # bcryptjs is pure-JS (zero .node file needed)
      - name: Build backend.exe
        run: pkg package.json --targets node18-win-x64 --output backend.exe

      # Copy better-sqlite3 native binary next to the exe.
      # pkg includes it in the snapshot but also needs it accessible on disk
      # for process.dlopen() to work correctly on Windows.
      - name: Copy native binaries next to backend.exe
        shell: powershell
        run: |
          $dest = "native-modules"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $bsqlite = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (Test-Path $bsqlite) {
            Copy-Item $bsqlite -Destination "$dest\better_sqlite3.node"
            Write-Host "[OK] Copied better_sqlite3.node"
          } else {
            Write-Warning "[WARN] better_sqlite3.node NOT FOUND - path: $bsqlite"
            Get-ChildItem "node_modules\better-sqlite3\build" -Recurse -Filter "*.node" -ErrorAction SilentlyContinue
          }

          Write-Host "Native modules to ship:"
          Get-ChildItem $dest

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe built: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found!"
            exit 1
          }

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            backend/backend.exe
            backend/native-modules/
