name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Visual Studio Build Tools
        shell: cmd
        run: |
          choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -y --no-progress
          choco install visualstudio2019-workload-vctools -y --no-progress

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build backend.exe
        run: pkg server.js --targets node18-win-x64 --output backend.exe

      - name: Copy sql-wasm.wasm next to backend.exe
        shell: powershell
        run: |
          $wasm = "node_modules\sql.js\dist\sql-wasm.wasm"
          if (Test-Path $wasm) {
            Copy-Item $wasm -Destination "sql-wasm.wasm"
            Write-Host "[OK] Copied sql-wasm.wasm"
          } else {
            Write-Warning "[WARN] sql-wasm.wasm NOT FOUND at $wasm"
            Get-ChildItem "node_modules\sql.js\dist" -ErrorAction SilentlyContinue
          }

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found"
            exit 1
          }

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            backend/backend.exe
            backend/sql-wasm.wasm
