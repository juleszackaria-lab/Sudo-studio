name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Add bin to package.json
        shell: powershell
        run: |
          $pkg = Get-Content "package.json" | ConvertFrom-Json
          $pkg | Add-Member -NotePropertyName "bin" -NotePropertyValue "server.js" -Force
          if (-not $pkg.pkg) {
            $pkgConfig = @{
              targets = @("node18-win-x64")
              scripts = @(
                "routes/**/*.js",
                "middleware/**/*.js",
                "models/**/*.js",
                "services/**/*.js",
                "utils/**/*.js",
                "ai/**/*.js",
                "doctor/**/*.js",
                "installers/**/*.js",
                "config/**/*.js"
              )
            }
            $pkg | Add-Member -NotePropertyName "pkg" -NotePropertyValue $pkgConfig -Force
          }
          $pkg | ConvertTo-Json -Depth 10 | Set-Content "package.json"
          Write-Host "[OK] Added bin and pkg config to package.json"
          Write-Host "--- package.json bin field ---"
          (Get-Content "package.json" | ConvertFrom-Json).bin

      - name: Build backend.exe
        run: pkg package.json --targets node18-win-x64 --output backend.exe

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe built: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found!"
            exit 1
          }

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/backend.exe
