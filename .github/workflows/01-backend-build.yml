name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Zero native C++ modules:
      #   lowdb@1.0.0  — pure JS JSON database, no wasm, no .node
      #   bcryptjs     — pure JS bcrypt, no .node
      # No Visual Studio Build Tools needed.

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build backend.exe
        run: pkg package.json --targets node18-win-x64 --output backend.exe

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe built: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found!"
            exit 1
          }

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/backend.exe
