name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # No Visual Studio Build Tools needed — zero native C++ modules.
      # sql.js = pure WebAssembly/JS. bcryptjs = pure JS. No .node files.

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      # Use package.json as entry point so pkg picks up the pkg.assets config
      # (which embeds sql-wasm.wasm in the snapshot as a fallback).
      # We also copy sql-wasm.wasm next to the exe on disk so locateFile()
      # can find it at path.dirname(process.execPath)/sql-wasm.wasm.
      - name: Build backend.exe
        run: pkg package.json --targets node18-win-x64 --output backend.exe

      # Copy sql-wasm.wasm next to backend.exe.
      # user.model.js locateFile: () => path.dirname(process.execPath)/sql-wasm.wasm
      # → this file must exist at that exact location when the exe runs.
      - name: Copy sql-wasm.wasm next to backend.exe
        shell: powershell
        run: |
          $wasmSrc = "node_modules\sql.js\dist\sql-wasm.wasm"
          if (Test-Path $wasmSrc) {
            Copy-Item $wasmSrc -Destination "sql-wasm.wasm"
            Write-Host "[OK] Copied sql-wasm.wasm next to backend.exe"
            $size = (Get-Item "sql-wasm.wasm").Length / 1KB
            Write-Host "[OK] sql-wasm.wasm size: $([math]::Round($size,0)) KB"
          } else {
            Write-Error "[FAIL] sql-wasm.wasm NOT FOUND at $wasmSrc"
            exit 1
          }

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "backend.exe") {
            $size = (Get-Item "backend.exe").Length / 1MB
            Write-Host "[OK] backend.exe built: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "[FAIL] backend.exe not found!"
            exit 1
          }
          if (Test-Path "sql-wasm.wasm") {
            Write-Host "[OK] sql-wasm.wasm present next to exe"
          } else {
            Write-Error "[FAIL] sql-wasm.wasm missing!"
            exit 1
          }
          Write-Host "Artifact contents:"
          Get-ChildItem . -Filter "*.exe"
          Get-ChildItem . -Filter "*.wasm"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            backend/backend.exe
            backend/sql-wasm.wasm
