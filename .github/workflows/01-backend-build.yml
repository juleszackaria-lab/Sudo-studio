name: 01 - Build Backend EXE

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build backend.exe with native module support
        run: |
          pkg server.js --targets node18-win-x64 --output backend.exe
          echo backend.exe built OK

      - name: Copy native binaries next to backend.exe
        shell: powershell
        run: |
          $dest = "native-modules"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # sqlite3
          $sqlite = "node_modules\sqlite3\build\Release\node_sqlite3.node"
          if (Test-Path $sqlite) {
            Copy-Item $sqlite -Destination "$dest\node_sqlite3.node"
            Write-Host "Copied node_sqlite3.node"
          } else {
            Write-Warning "node_sqlite3.node NOT FOUND - sqlite3 will fail at runtime"
          }

          # bcrypt
          $bcrypt = "node_modules\bcrypt\lib\binding\napi-v3\bcrypt_lib.node"
          if (Test-Path $bcrypt) {
            Copy-Item $bcrypt -Destination "$dest\bcrypt_lib.node"
            Write-Host "Copied bcrypt_lib.node"
          } else {
            Write-Warning "bcrypt_lib.node NOT FOUND - bcrypt will fail at runtime"
          }

          Write-Host "Native modules to ship:"
          Get-ChildItem $dest

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            backend/backend.exe
            backend/native-modules/
