name: 00 - Test suite (backend + extension)

# P60: the product's own test composer (`backend/npm test`, 49 suites) was
# NEVER executed by CI: workflow 01 only ran tests/test-p30-backend.js. Seven
# suites had been red for weeks without anyone noticing, and P60 fixes them.
# This workflow is the place where "the whole suite is green" is proven.
#
# It is deliberately separate from 01/02/03: those build Windows artifacts and
# must not gain a new failure surface. Runs on Linux, on every push to main
# and on demand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'sudo-ai-extension/**'
      - '.github/workflows/00-test-suite.yml'

permissions:
  contents: read

env:
  NODE_VERSION: "18"

jobs:
  static-suite:
    name: 49 suites (backend composer)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Install extension deps
        working-directory: sudo-ai-extension
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Backend self-test (pkg snapshot trap / missing requires)
        working-directory: backend
        run: node server.js --selftest

      - name: Whole suite
        working-directory: backend
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/suite.log
          rc=${PIPESTATUS[0]}
          echo "--- resume ---"
          grep -E '^(>>> FAILED|TOTAL)' /tmp/suite.log || true
          if grep -q '^>>> FAILED' /tmp/suite.log; then
            echo '[FAIL] au moins une suite est rouge'
            exit 1
          fi
          # P61-D/P62: le compte de suites augmente (49 -> 51 avec P61, 54 avec P62). On exige
          # "0 failed" ET un minimum, pour qu'une suite supprimee du compositeur
          # ne passe pas pour un vert.
          grep -qE 'TOTAL: [0-9]+ suites, 0 failed' /tmp/suite.log || {
            echo '[FAIL] le compositeur n annonce pas 0 echec'
            exit 1
          }
          suites=$(grep -oE 'TOTAL: [0-9]+ suites' /tmp/suite.log | grep -oE '[0-9]+' | tail -1)
          echo "suites executees : $suites (minimum exige : 54)"
          if [ "$suites" -lt 54 ]; then
            echo '[FAIL] moins de suites que le minimum attendu'
            exit 1
          fi
          exit $rc

      - name: No SKIP hidden as a pass
        working-directory: backend
        run: |
          set -euo pipefail
          # test-ai-flow is a LIVE test (needs the runtime): its skip is
          # expected and printed. Any OTHER skip line is a defect.
          others=$(grep '^SKIP ' /tmp/suite.log | grep -v 'test-ai-flow.js' || true)
          if [ -n "$others" ]; then
            echo "$others"
            echo '[WARN] suites non executees (a corriger, ecrit comme non prouve)'
          fi

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P60-test-suite-log
          path: /tmp/suite.log
          if-no-files-found: warn
          retention-days: 30

  # P65-C7/C9: BANC D'ESSAI DE L'AGENT, BLOQUANT. Il execute 34 taches
  # deterministes sur trois projets (Next.js, Flutter, Python) avec le FAUX
  # fournisseur, et verifie le resultat sur le disque (fichiers, syntaxe,
  # tests, git status). Aucun modele, aucun reseau, aucun artefact.
  # Les mesures d'un vrai modele (jetons/s, RAM runtime) restent "NON MESURE
  # ICI" : elles se font sur un PC via scripts/agent-bench.sh|ps1.
  agent-bench:
    name: Agent bench (faux fournisseur)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps (harnais)
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Banc d essai (34 taches, verification automatique)
        run: |
          set -o pipefail
          node scripts/ci/agent-bench.js --json /tmp/agent-bench-report.json 2>&1 | tee /tmp/agent-bench.log
          rc=${PIPESTATUS[0]}
          python3 - <<'PY'
          import json, sys
          with open('/tmp/agent-bench-report.json') as f:
              rep = json.load(f)
          m = rep['measures']
          print('taches : %s/%s (%s%%)' % (m['ok'], m['tasks'], m['rate']))
          if m['ok'] != m['tasks']:
              print('[FAIL] toutes les taches du banc ne passent pas')
              sys.exit(1)
          if m['tokensPerSecond'] is not None:
              print('[FAIL] jetons/seconde mesures avec un faux fournisseur : chiffre invente')
              sys.exit(1)
          PY
          if [ $rc -ne 0 ]; then echo '[FAIL] banc rouge'; exit $rc; fi
          exit 0

      - name: Preuves (rapport JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P65-agent-bench
          path: |
            /tmp/agent-bench-report.json
            /tmp/agent-bench.log
          if-no-files-found: warn
          retention-days: 30

  # P61-D: le script de preuve utilisateur (scripts/agent-e2e.ps1) doit etre
  # ANALYSE syntaxiquement par la CI, pas seulement ecrit sur un PC Windows.
  # pwsh est present sur les runners Linux : aucun modele, aucun runtime.
  powershell-syntax:
    name: PowerShell syntax (scripts/*.ps1)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script with the PowerShell parser
        shell: pwsh
        run: |
          $bad = 0
          $files = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse
          if (-not $files) { Write-Error 'aucun script .ps1 trouve'; exit 1 }
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host ("[FAIL] " + $f.Name)
              $errors | ForEach-Object { Write-Host ("       ligne " + $_.Extent.StartLineNumber + " : " + $_.Message) }
            } else {
              Write-Host ("[PASS] " + $f.Name)
            }
          }
          if ($bad -gt 0) { Write-Error ("scripts .ps1 invalides : " + $bad); exit 1 }
          Write-Host 'Tous les scripts .ps1 sont syntaxiquement valides.'

  # ---------------------------------------------------------------------------
  # P67: banc "MODELE REEL" (aucun faux fournisseur).
  # Qwen2.5-Coder-1.5B-Instruct Q4_K_M (Apache-2.0), le meme modele que sur PC.
  # Ce job MESURE: il n'est pas encore bloquant (continue-on-error) tant que la
  # correction du protocole "petit modele" n'est pas livree. Il ne remplace
  # aucun autre job et n'ajoute aucun fichier au produit.
  # ---------------------------------------------------------------------------
  p67-real-model:
    name: P67 - modele reel (Qwen2.5-Coder-1.5B Q4_K_M)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache du modele GGUF
        uses: actions/cache@v4
        with:
          path: ~/p67-model
          key: p67-qwen25-coder-1.5b-q4km-v1

      - name: Telecharger le modele (si absent du cache)
        run: |
          mkdir -p ~/p67-model
          F=~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          if [ ! -s "$F" ]; then
            curl -sL -o "$F" "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          fi
          ls -l "$F"
          sha256sum "$F"

      - name: Installer le moteur d'inference (llama-cpp-python CPU)
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python==0.3.9 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install flask flask-cors psutil requests huggingface_hub
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"

      - name: "Demarrer le runtime du produit (repli sur serveur llama-cpp)"
        run: |
          F=~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          M=qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          mkdir -p ~/.sudo_studio/models
          cp -f "$F" ~/.sudo_studio/models/"$M"
          echo "runtime-du-produit" > p67-engine.txt
          (python backend/runtime/server.enterprise.py --model "$M" --port 6000 --host 127.0.0.1 > runtime.log 2>&1 &) || true
          ok=0
          for i in $(seq 1 72); do
            MODELS=$(curl -sf http://127.0.0.1:6000/v1/models 2>/dev/null || true)
            if echo "$MODELS" | grep -q '"id"'; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "runtime-du-produit sans modele charge -> repli llama-cpp.server" | tee -a runtime.log
            echo "llama-cpp-server" > p67-engine.txt
            pkill -f server.enterprise.py || true
            (python -m llama_cpp.server --model "$F" --n_ctx 4096 --host 127.0.0.1 --port 6000 > runtime.log 2>&1 &) || true
            for i in $(seq 1 72); do
              if curl -sf http://127.0.0.1:6000/v1/models 2>/dev/null | grep -q '"id"'; then ok=1; break; fi
              sleep 5
            done
          fi
          echo "moteur=$(cat p67-engine.txt) modele_pret=$ok"
          tail -30 runtime.log || true
          if [ "$ok" != "1" ]; then echo "aucun modele charge"; exit 1; fi

      - name: Banc modele reel (taches a a d)
        run: |
          node scripts/ci/p67-real-model-bench.js \
            --url http://127.0.0.1:6000 \
            --model qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
            --out p67-results

      - name: Journaux (toujours)
        if: always()
        run: |
          echo "=== moteur ==="; cat p67-engine.txt 2>/dev/null || true
          echo "=== agent.log (rejets et appels) ==="
          grep -E "appel modele|appel outil invalide|format de secours|GRAMMAR|turn start|verdict" p67-results/agent.log 2>/dev/null | tail -60 || true
          echo "=== runtime.log (grammaire, rejets) ==="
          grep -E "\[GRAMMAR\]|\[OPENAI\] tool rejete|\[OPENAI\]" runtime.log 2>/dev/null | tail -40 || true

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p67-real-model
          path: |
            p67-results/
            runtime.log
            p67-engine.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # P68-A3: TEMOIN DE GRAMMAIRE avec le vrai modele.
  # Meme serie de 50 consignes, deux grammaires: celle du depot (corrigee) et
  # celle d'avant (temoins negatifs). Analyse STRICTE (json.loads) + schema.
  # ---------------------------------------------------------------------------
  p68-grammar:
    name: P68 - grammaire (50 consignes, vrai modele)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache du modele GGUF
        uses: actions/cache@v4
        with:
          path: ~/p67-model
          key: p67-qwen25-coder-1.5b-q4km-v1

      - name: Telecharger le modele (si absent du cache)
        run: |
          mkdir -p ~/p67-model
          F=~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          if [ ! -s "$F" ]; then
            curl -sL -o "$F" "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          fi
          sha256sum "$F"

      - name: Installer llama-cpp-python (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python==0.3.9 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Temoin - grammaire du depot (corrigee)
        run: |
          python3 scripts/ci/p68-grammar-witness.py --model ~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf --grammar fixed --out p68-results || echo "TEMOIN ROUGE (voir tableau)"

      - name: Controle negatif - grammaire d'avant (doit etre rouge)
        run: |
          python3 scripts/ci/p68-grammar-witness.py --model ~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf --grammar legacy --out p68-results || true

      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          f = json.load(open('p68-results/p68-witness-fixed.json'))
          l = json.load(open('p68-results/p68-witness-legacy.json'))
          print('APRES (grammaire corrigee) : %d/%d valides' % (f['valides'], f['total']))
          print('AVANT (ancienne grammaire) : %d/%d valides' % (l['valides'], l['total']))
          if l['valides'] == l['total']:
              print('[FAIL] le controle negatif est VERT : le temoin ne peut pas echouer, il ne prouve rien')
              raise SystemExit(1)
          if f['valides'] == f['total']:
              print('[PASS] 100 % de JSON strict avec la grammaire corrigee, et l ancienne grammaire echoue')
          else:
              print('[PARTIEL] la grammaire corrigee ne donne pas 100 % : voir les lignes INVALIDE')
          PY

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p68-grammar
          path: p68-results/
          if-no-files-found: warn

  p68-context:
    name: P68 - fenetre de contexte reelle (2048/4096/8192)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache du modele GGUF
        uses: actions/cache@v4
        with:
          path: ~/p67-model
          key: p67-qwen25-coder-1.5b-q4km-v1

      - name: Telecharger le modele (si absent du cache)
        run: |
          mkdir -p ~/p67-model
          F=~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          if [ ! -s "$F" ]; then
            curl -sL -o "$F" "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          fi
          sha256sum "$F"

      - name: Installer llama-cpp-python (CPU) et le serveur reel
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python==0.3.9 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install flask flask-cors psutil requests huggingface_hub

      - name: Temoin du comptage reel (POST /tokenize, chemin de l agent)
        run: |
          set -o pipefail
          python3 scripts/ci/p68-tokenize-witness.py \
            --model ~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
            --out p68-results | tee p68-results-tokenize.txt

      - name: Mesure - fenetre reelle, memoire, estimateur de jetons
        run: |
          set -o pipefail
          python3 scripts/ci/p68-context-bench.py \
            --model ~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
            --out p68-results --ctx 2048,4096,8192 \
            --tokenize-witness p68-results/p68-tokenize.json | tee p68-results-context.txt

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p68-context
          path: |
            p68-results/
            p68-results-context.txt
            p68-results-tokenize.txt
            p68-logs/
          if-no-files-found: warn

  p69-runtime:
    name: P69 - survie du runtime (300 appels + plantage injecte)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache du modele GGUF
        uses: actions/cache@v4
        with:
          path: ~/p67-model
          key: p67-qwen25-coder-1.5b-q4km-v1

      - name: Telecharger le modele (si absent du cache)
        run: |
          mkdir -p ~/p67-model
          F=~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          if [ ! -s "$F" ]; then
            curl -sL -o "$F" "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          fi
          sha256sum "$F"

      - name: Installer les dependances du vrai serveur
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors psutil requests huggingface_hub
          pip install llama-cpp-python==0.3.9 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Rendre le modele visible du runtime (detection locale)
        run: |
          mkdir -p ~/.sudo_studio/models
          cp ~/p67-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf ~/.sudo_studio/models/

      - name: Serie de 120 appels (fenetre reelle) + plantage injecte
        run: |
          mkdir -p p69-results
          python3 scripts/ci/p69-crash-bench.py --out p69-results --calls 120 \
            2>&1 | tee p69-results/p69-crash-console.txt

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-runtime
          path: |
            p69-results/
            p69-logs/
          if-no-files-found: warn
