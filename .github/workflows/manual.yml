name: 03 - Package Sudo Studio (Windows Installer) - FINAL

# Declenchement 100% manuel
on:
  workflow_dispatch:
    inputs:
      backend_run_id:
        description: 'ID run Backend'
        required: true
        type: string
        default: '22258331626'
      runtime_run_id:
        description: 'ID run Runtime'
        required: true
        type: string
        default: '22039587993'
      confirm_manual:
        description: "Tapez I_CONFIRM_RUN pour confirmer un lancement manuel depuis l'UI"
        required: true
        type: string

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_manual == 'I_CONFIRM_RUN' }}
    runs-on: windows-latest

    permissions:
      actions: read
      contents: read
      id-token: none
      pull-requests: none
      issues: none
      checks: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # STEP 1 - Download compiled binaries
      # ============================================================
      - name: Download backend artifact
        uses: dawidd6/action-download-artifact@v5
        with:
          name: backend-exe
          path: build-assets/backend
          run_id: ${{ github.event.inputs.backend_run_id }}
          github_token: ${{ secrets.PAT_DOWNLOAD }}

      - name: Download runtime artifact
        uses: dawidd6/action-download-artifact@v5
        with:
          name: runtime-exe
          path: build-assets/runtime
          run_id: ${{ github.event.inputs.runtime_run_id }}
          github_token: ${{ secrets.PAT_DOWNLOAD }}

      # ============================================================
      # STEP 2 - Download and extract VSCodium
      # ============================================================
      - name: Download VSCodium
        run: curl -L -o vscodium.zip https://github.com/VSCodium/vscodium/releases/latest/download/VSCodium-win32-x64-1.90.0.0.zip

      - name: Extract VSCodium
        run: powershell Expand-Archive vscodium.zip -DestinationPath vscodium-extracted

      # ============================================================
      # STEP 3 - Build final package structure
      #
      # Target structure after installation ({app} = install root):
      #
      #   {app}\
      #     VSCodium.exe              <- VSCodium main executable
      #     ... (all VSCodium files)
      #     app\
      #       backend.exe             <- Node.js/Express (pkg)
      #       runtime.exe             <- Python/Flask AI
      #       native-modules\         <- better_sqlite3.node (bcryptjs is pure-JS)
      #         better_sqlite3.node
      #       extensions\
      #         sudo-ai\              <- Sudo AI VSCode extension
      #           extension.js
      #           package.json
      #           src\
      #             ...
      #       data\                   <- VSCodium user data dir
      #     start.bat                 <- Our v4.0 launcher (from repo)
      #     logs\                     <- Created at runtime
      #
      # start.bat uses:
      #   %~dp0VSCodium.exe           <- correct (root)
      #   %~dp0app\backend.exe        <- correct (app subdir)
      #   %~dp0app\runtime.exe        <- correct (app subdir)
      #   %~dp0app\extensions\sudo-ai <- correct (app/extensions subdir)
      # ============================================================

      - name: Create package structure
        shell: powershell
        run: |
          # Root = vscodium-extracted contents (VSCodium.exe lives here)
          $root = "package-root"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\app" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\app\native-modules" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\app\extensions\sudo-ai" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\app\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\logs" | Out-Null

          # Copy VSCodium files to root
          Copy-Item "vscodium-extracted\*" -Destination $root -Recurse -Force
          Write-Host "VSCodium files copied to root"

          # Copy backend.exe
          Copy-Item "build-assets\backend\backend.exe" -Destination "$root\app\backend.exe"
          Write-Host "backend.exe copied"

          # Copy native modules (better_sqlite3.node) - bcryptjs is pure-JS, no .node needed
          if (Test-Path "build-assets\backend\native-modules") {
            Copy-Item "build-assets\backend\native-modules\*" -Destination "$root\app\native-modules\" -Force
            Write-Host "Native modules copied:"
            Get-ChildItem "$root\app\native-modules"
          } else {
            Write-Warning "No native-modules folder found in backend artifact - backend may fail on Windows"
          }

          # Copy runtime.exe
          Copy-Item "build-assets\runtime\server.exe" -Destination "$root\app\runtime.exe"
          Write-Host "runtime.exe copied"

          # Copy Sudo AI extension - FIX: was missing entirely in previous workflow
          Copy-Item "sudo-ai-extension\*" -Destination "$root\app\extensions\sudo-ai\" -Recurse -Force -Exclude "node_modules"
          Write-Host "Sudo AI extension copied"

          # Copy start.bat from repo (our v4.0 - NOT regenerated inline)
          Copy-Item "start.bat" -Destination "$root\start.bat"
          Write-Host "start.bat v4.0 copied from repo"

          # Verify structure
          Write-Host ""
          Write-Host "=== Package structure ==="
          Get-ChildItem $root -Recurse | Select-Object FullName | ForEach-Object { $_.FullName.Replace((Resolve-Path $root).Path, "") }

      # ============================================================
      # STEP 4 - Verify critical files exist before packaging
      # ============================================================
      - name: Verify package structure
        shell: powershell
        run: |
          $root = "package-root"
          $errors = 0

          $required = @(
            "$root\VSCodium.exe",
            "$root\app\backend.exe",
            "$root\app\runtime.exe",
            "$root\app\extensions\sudo-ai\extension.js",
            "$root\app\extensions\sudo-ai\package.json",
            "$root\start.bat"
          )

          foreach ($f in $required) {
            if (Test-Path $f) {
              Write-Host "  [OK] $f"
            } else {
              Write-Error "  [MISSING] $f"
              $errors++
            }
          }

          if ($errors -gt 0) {
            Write-Error "$errors required file(s) missing - aborting"
            exit 1
          }

          Write-Host ""
          Write-Host "All required files present - proceeding with installer build"

      # ============================================================
      # STEP 5 - Build installer with Inno Setup
      # ============================================================
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          # Write installer.iss dynamically to match our package-root structure
          # WorkingDir is CRITICAL so start.bat runs from the correct directory
          $iss = @"
[Setup]
AppName=Sudo Studio
AppVersion=1.0
DefaultDirName={pf}\SudoStudio
DefaultGroupName=SudoStudio
OutputBaseFilename=SudoStudio-Setup
Compression=lzma
SolidCompression=yes

[Files]
; Copy entire package-root into {app}
; Result: VSCodium.exe at {app}\ and app\ subdirectory at {app}\app\
Source: "package-root\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
; WorkingDir is CRITICAL: without it Windows may launch from System32
Name: "{group}\SudoStudio"; Filename: "{app}\start.bat"; WorkingDir: "{app}"; Comment: "Launch Sudo Studio"
Name: "{commondesktop}\SudoStudio"; Filename: "{app}\start.bat"; WorkingDir: "{app}"; Comment: "Launch Sudo Studio"

[Run]
Filename: "{app}\start.bat"; WorkingDir: "{app}"; Description: "Lancer Sudo Studio"; Flags: nowait postinstall skipifsilent
"@

          $iss | Out-File -Encoding ASCII -FilePath installer-final.iss
          Write-Host "installer-final.iss written"
          Get-Content installer-final.iss

          # Build
          iscc installer-final.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SudoStudio-Installer
          path: Output\SudoStudio-Setup.exe
